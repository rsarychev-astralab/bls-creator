<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLS Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <img class="logo" src="/static/logo.svg" alt="AstraLab" width="90" height="20">
        <h1>BLS Creator</h1>
      </div>
      <p>Одна кампания за запуск. Сначала сбор, потом модель.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>1. Кампания</h2>
      <label for="campaign">Название РК</label>
      <select id="campaign">
        <option value="">Загрузка списка…</option>
      </select>

      <div class="grid" style="margin-top: 0.9rem;">
        <div>
          <label>Дата заявки</label>
          <div id="f-date" class="readonly empty">—</div>
        </div>
        <div>
          <label>Тип исследования</label>
          <div id="f-type" class="readonly empty">—</div>
        </div>
        <div>
          <label>DL</label>
          <div id="f-dl" class="readonly empty">—</div>
        </div>
        <div>
          <label>Ссылка в CRM</label>
          <div id="f-crm" class="readonly empty">—</div>
        </div>
        <div>
          <label>Ссылка на сделку в Notion</label>
          <div id="f-notion" class="readonly empty">—</div>
        </div>
        <div>
          <label>Ссылка на Buying Table</label>
          <div id="f-bt" class="readonly empty">—</div>
        </div>
        <div class="span-2 stats-block">
          <h3>Закрытие</h3>
          <div class="grid" id="closing-grid"></div>
        </div>
        <div class="span-2">
          <label>ЦА + таргетинг</label>
          <div id="f-targeting" class="readonly readonly-wrap empty">—</div>
        </div>
        <div>
          <label>Количество респондентов</label>
          <div id="f-respondents" class="readonly empty">—</div>
        </div>
        <div>
          <label>Время генерации</label>
          <div id="f-elapsed" class="readonly empty">—</div>
        </div>
        <div class="span-2">
          <label>Результаты исследования</label>
          <div id="f-result" class="readonly empty">—</div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn-collect" id="btn-collect" disabled>Собрать данные исследования</button>
        <button type="button" class="btn-model" id="btn-model" disabled>Смоделировать исследование</button>
        <button type="button" class="btn-stop" id="btn-stop" disabled>Стоп</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section class="card" id="collect-card" hidden>
      <h2>Собранные данные</h2>
      <div id="collect-meta" class="meta-row"></div>
      <pre id="collect-view"></pre>
    </section>

    <section class="card" id="model-card" hidden>
      <h2>Результат модели</h2>
      <pre id="model-view"></pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
